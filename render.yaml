services:
  - type: web
    name: barka-store
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    autoDeploy: true
    envVars:
      - key: BARKA_SECRET_KEY
        generateValue: true
      - key: BARKA_ADMIN_USERNAME
        value: admin
      - key: BARKA_ADMIN_PASSWORD
        sync: false
      - key: BARKA_DATABASE
        value: /var/data/barka.db
      - key: BARKA_UPLOAD_FOLDER
        value: /var/data/uploads/products
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: barka-data
      mountPath: /var/data
      sizeGB: 1
